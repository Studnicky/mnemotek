name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Version + Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/node-setup
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@studnicky'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install social-preview renderer
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y librsvg2-bin

      - name: Generate version-stamped social preview
        run: pnpm run generate:og

      - name: CI gate
        run: pnpm run ci

      - name: Run Changesets
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm run changeset:version
          publish: pnpm run publish:all
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
