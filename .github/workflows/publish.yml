name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@studnicky'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install social-preview renderer
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y librsvg2-bin

      - name: Generate version-stamped social preview
        run: pnpm run generate:og

      - name: Run CI checks
        run: pnpm run ci

      - name: Publish package
        run: pnpm run publish:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
