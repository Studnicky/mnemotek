name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/node-setup
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@studnicky'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install social-preview renderer
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y librsvg2-bin

      - name: Generate version-stamped social preview
        run: pnpm run generate:og

      - name: Run CI checks
        run: pnpm run ci

      - name: Publish package
        run: pnpm run publish:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
