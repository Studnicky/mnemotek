name: Changeset Check

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  changeset-check:
    if: |
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release/') &&
      !startsWith(github.head_ref, 'hotfix/') &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      !startsWith(github.head_ref, 'chore/backmerge-')
    name: Verify Changeset
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check for changeset
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No changeset found for this PR. Run 'pnpm exec changeset' to describe your change."
            exit 1
          fi

          echo "Found $COUNT changeset(s)."
