description: Sets up pnpm + Node.js with pnpm caching and installs dependencies. Callers must check out the repository first — a composite action referenced via a local path cannot check itself out, since GitHub Actions must already have the repo on disk to resolve the action's own definition.
inputs:
  node-version:
    default: '24'
    description: 'Node.js version to install'
    required: false
  registry-url:
    description: 'Optional registry URL to configure for npm/pnpm (e.g. for publish workflows)'
    required: false
  scope:
    description: 'Optional scope to associate with the registry (e.g. for scoped GitHub Packages publish)'
    required: false
name: node-setup
runs:
  steps:
    - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      with:
        run_install: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
